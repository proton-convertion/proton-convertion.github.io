<!DOCTYPE html>
<html lang="ru">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
	<link rel="icon" href="proton.svg" type="image/x-icon">
	<link rel="stylesheet" href="styles.css">
	<script defer src="script.js"></script>
	<script defer src="quic.js"></script>
	<title>ProtonVPN Конвертер</title>
</head>
<body>
<div class="wrapper">
	<img id="logo" src="logo.svg" alt="Логотип">
	<div class="container-columns">
		<div class="container">
			<label for="wgFiles" class="custom-file-upload" id="fileUploadLabel">Выбрать файлы</label>
			<input type="file" id="wgFiles" accept=".conf" multiple class="hidden-input">
			<button onclick="convert()">Конвертировать</button>

			<label><div class="checkbox">
				<input type="radio" id="awg" name="option" class="radio" checked>
				<span class="radio-fakeradio"></span><img src="AWG.webp" alt="AmneziaWG Icon" class="amnezia-icon">AmneziaWG
			</div></label><br>
			<label><div class="checkbox">
				<input type="radio" id="karing" name="option" class="radio">
				<span class="radio-fakeradio"></span><img src="WireSock.webp" alt="AmneziaWG Icon" class="amnezia-icon">WireSock 
			</div></label><br>
			<label><div class="checkbox">
				<input type="radio" id="clash" name="option" class="radio">
				<span class="radio-fakeradio"></span><img src="Clash.webp" alt="AmneziaWG Icon" class="amnezia-icon">Clash
			</div></label>
		</div>
		<div class="container2">
			<div class="musor1" style="line-height: 9px;">
				<label class="toggle" style="display: block; text-align: center">
					<input class="toggle-checkbox" type="checkbox" id="nojunk" checked disabled>
					<div class="toggle-switch"></div>
					<span class="toggle-label">AWG 1.0</span>
				</label>
				
				<label><div class="checkbox">
					<input type="radio" id="junk1" name="junk" class="radio" checked>
					<span class="radio-fakeradio"></span> jc = 3 jmin = 1 jmax = 3 
				</div></label><br>
				<label><div class="checkbox">
					<input type="radio" id="junk2" name="junk" class="radio">
					<span class="radio-fakeradio"></span> jc = 30 jmin = 10 jmax = 30 
				</div></label><br>
				<label><div class="checkbox" style="padding-bottom: 10px">
					<input type="radio" id="junk3" name="junk" class="radio">
					<span class="radio-fakeradio"></span> Свой вариант
				</div></label>
				jc = <textarea id="jc1" class="jc" rows="1" maxlength="3" type="number" placeholder="128"></textarea> 
				jmin = <textarea spellcheck="false" id="jmin1" class="jc" rows="1" maxlength="4" type="number" placeholder="1279"></textarea> 
				jmax = <textarea spellcheck="false" id="jmax1" class="jc" rows="1" maxlength="4" placeholder="1280"></textarea>
				<button onclick="" class="randombtn">Случайно</button>
			</div>
		</div>
	</div>

<div id="griddiv">

	<div class="container3 hidden" id="15awg">
		<div class="musor1"  style="line-height: 27px;">
			<label class="toggle" style="text-align: center; padding-bottom: 10px; display: block;">
				<input class="toggle-checkbox" type="checkbox" id="awg15" checked disabled>
				<div class="toggle-switch"></div>
				<span class="toggle-label">AWG 2.0</span>
			</label>
			I1 = <textarea spellcheck="false" id="i1" class="jc" rows="1" wrap="off" placeholder="<b 0xc600000...>"></textarea> 
			<br>I2 = <textarea spellcheck="false" id="i2" class="jc" rows="1" wrap="off" placeholder="<b 0x...>"></textarea> 
			<br>I3 = <textarea spellcheck="false" id="i3" class="jc" rows="1" wrap="off" placeholder="<b 0x...>"></textarea>
			<br>I4 = <textarea spellcheck="false" id="i4" class="jc" rows="1" wrap="off" placeholder="<b 0x...>"></textarea>
			<br>I5 = <textarea spellcheck="false" id="i5" class="jc" rows="1" wrap="off" placeholder="<b 0x...>"></textarea>
			<button onclick="" class="randombtn">Случайно</button>
			<button onclick="" class="genbtn" style="margin-top: 15px;">Сгенерировать</button>
		</div>
	</div>

	<div class="container3 hidden" id="15wiresock">
		<div class="musor1"  style="line-height: 27px;">

			<label class="toggle" style="text-align: center; padding-bottom: 10px; display: block;">
				<input class="toggle-checkbox" type="checkbox" id="awg2w" checked disabled>
				<div class="toggle-switch"></div>
				<span class="toggle-label">AWG 2.0</span>
			</label>

			Id = <textarea spellcheck="false" id="id" class="jc" rows="1" wrap="off" placeholder="ozon.ru"></textarea><br>
			Ip = <select name="select" id="ip">
				<option value="quic"selected>QUIC</option>
				<option value="dns">DNS</option>
			</select><br>
			Ib = <select name="select" id="ib">
				<option value="chrome">Chrome</option>
				<option value="firefox">Firefox</option>
				<option value="curl" selected>cURL</option>
			</select>
			<button onclick="" class="randombtn">Случайно</button>
		</div>
	</div>

	<div class="container4" id="awg3">
		<div class="musor1"  style="line-height: 27px;">
			<label class="toggle" style="text-align: center; padding-bottom: 10px; display: block;">
				<input class="toggle-checkbox" type="checkbox" id="awg3s" checked disabled>
				<div class="toggle-switch"></div>
				<span class="toggle-label">AWG 3.0</span>
			</label>

	<div id="musor3div" style="display: grid; grid-template-columns: repeat(1, 1fr);">
        <div>
            <div>ContentPaddingAddition = <textarea id="cpaInput" class="jc" rows="1" maxlength="7" placeholder="27-97"></textarea></div>
            <div>MaxHandshakeAttempts = <textarea id="mhaInput" class="jc" rows="1" maxlength="7" placeholder="18-26"></textarea></div>
            <div>KeepaliveTimeout = <textarea id="ktInput" class="jc" rows="1" maxlength="7" placeholder="9-16"></textarea></div>
        </div>
        <div>
            <div>RejectAfterTime = <textarea id="ratInput" class="jc" rows="1" maxlength="7" placeholder="171-196"></textarea></div>
            <div>RekeyAfterTime = <textarea id="rkatInput" class="jc" rows="1" maxlength="7" placeholder="116-131"></textarea></div>
            <div>RekeyTimeout = <textarea id="rtInput" class="jc" rows="1" maxlength="7" placeholder="6-9"></textarea></div>
        </div>
    </div>

    <button onclick="randomizeAwg3()" class="randombtn">Случайно</button>
			
		</div>
	</div>
</div>


		<div class="infobtn">
			<div class="file-list" id="fileList"></div>
			<div class="result" id="output">

			
							
			<div class="switch">
			
				
				<label class="toggle" style="text-align: center; display: block; padding-bottom: 5px;">
					<input class="toggle-checkbox" type="checkbox" id="awg31">
					<div class="toggle-switch"></div>
					<span class="toggle-label">Disable cookies (AWG 3.1)</span>
				</label>
				<label class="toggle" style="text-align: center; display: block; padding-bottom: 5px;">
					<input class="toggle-checkbox" type="checkbox" id="kepalive">
					<div class="toggle-switch"></div>
					<span class="toggle-label">PersistentKeepalive = <textarea id="keepaliveInput" class="jc" rows="1" maxlength="3" type="number" placeholder="25" style="text-align: center; max-width: 23px"></textarea></span>
				</label>
				<label class="toggle">
					<input class="toggle-checkbox" type="checkbox" id="nolan" disabled>
					<div class="toggle-switch"></div>
					<span class="toggle-label" style="padding-right: 0px;">Исключить LAN</span>
				</label>
				<div>
					<span>MTU =</span>
					<textarea id="mtu" class="jc" rows="1" maxlength="4" type="number" placeholder="1420" style="margin: 0; position: relative; top: 2px; max-width: 30px;"></textarea>
				</div>
			</div>
<span>Порт в Endpoint:</span>
                        <div onchange="convert()" style="justify-content: center; padding-bottom: 10px; padding-top: 5px;">
<label><input type="radio" name="wgPort" value="80" class="peer hidden"> <span class="port-btn">80</span></label>
<label><input type="radio" name="wgPort" value="88" class="peer hidden"> <span class="port-btn">88</span></label>
<label><input type="radio" name="wgPort" value="443" class="peer hidden"> <span class="port-btn">443</span></label>
<label><input type="radio" name="wgPort" value="500" class="peer hidden"> <span class="port-btn">500</span></label>
<label><input type="radio" name="wgPort" value="1194" class="peer hidden"> <span class="port-btn">1194</span></label>
<label><input type="radio" name="wgPort" value="1224" class="peer hidden"> <span class="port-btn">1224</span></label>
<label><input type="radio" name="wgPort" value="4500" class="peer hidden"> <span class="port-btn">4500</span></label>
<label><input type="radio" name="wgPort" value="4569" class="peer hidden"> <span class="port-btn">4569</span></label>
<label><input type="radio" name="wgPort" value="5060" class="peer hidden"> <span class="port-btn">5060</span></label>
<label><input type="radio" name="wgPort" value="51820" class="peer hidden" checked> <span class="port-btn">51820</span></label>
                        </div>

				<textarea id="yamlOutput" placeholder="Результат появится здесь..." class="textarea1" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
				<div class="button-container hidden" id="btn-cont">
					<button class="download-btn hidden" id="downloadBtn">Скачать</button>
					<button class="download-btn hidden" id="copyBtn">Скопировать</button>
				</div>
			</div>
			<div style="display: block; text-align: center; padding: 10px">
			<button id="tgButton" style="max-width: 400px;"><span class="button__text">Telegram</span></button>
			<button id="promoButton" class="glow-on-hover"><span class="button__text">Amnezia <a style="color: #A40059">Premium<a></span></button>
			<button id="adButton" class="whitelist-button">
				<span>Обход белых списков</span>
				<span class="whitelist-button__icon" aria-hidden="true">
					<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
				</span>
			</button>
			<button id="warpButton" style="max-width: 400px;"><span class="button__text">Другие проекты</span></button>
			</div>
			<div id="info1">Сделано на основе ресурсов <a href="https://zaeboba.github.io/page/archive/clash.html" target="_blank" rel="noopener noreferrer">zaeboba</a> и <a href="https://sageptr.github.io/mini_quic_generator" target="_blank" rel="noopener noreferrer">sageptr</a></div>
		</div>
<div id="Modal" class="modal">
	<div class="modal-content">
		<span class="close" onclick="closeModal()">&times;</span>
		<p align="center">Введите домен</p>
		<textarea spellcheck="false" id="domain" class="jc" rows="1" wrap="off" placeholder="example.com"></textarea> 
		<button id="selectDomain" style="margin-bottom:0px">Подтвердить</button>
	</div>
</div>
</div>
</body></html>
